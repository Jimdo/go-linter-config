version: "2"
run:
  allow-parallel-runners: true
linters:
  default: none
  enable:
    - dupl
    - errcheck
    - ginkgolinter
    - goconst
    - gosec
    - gocyclo
    - govet
    - ineffassign
    - revive
    - misspell
    - nakedret
    - staticcheck
    - unparam
    - unused
  settings:
    goconst:
      # golangci-lint runs goconst on test files by default (unlike upstream
      # goconst, which ignores them). Repeated string literals in table-driven
      # tests and fixtures are idiomatic; counting them toward goconst's
      # 3-occurrence threshold forces pointless constants for strings used only
      # once in production. Restrict goconst to production code.
      ignore-tests: true
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - lll
        path: api/*
      - linters:
          - dupl
          - lll
        path: internal/*
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
